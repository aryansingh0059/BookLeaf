openapi: 3.0.3
info:
  title: BookLeaf API
  version: 1.0.0
  description: Author support and communication API for BookLeaf.
servers:
  - url: /api/v1
    description: Versioned API
paths:
  /:
    get:
      operationId: getApiRoot
      summary: API service information
      servers:
        - url: /
      security: []
      responses:
        "200":
          description: API name, status, and useful links.
          content:
            application/json:
              schema:
                type: object
                required: [name, status, docs, health]
                properties:
                  name:
                    type: string
                    example: BookLeaf API
                  status:
                    type: string
                    example: ok
                  docs:
                    type: string
                    example: /api/docs
                  health:
                    type: string
                    example: /api/v1/health
  /auth/login:
    post:
      operationId: login
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Authenticated user and signed JWT.
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user
      responses:
        "200":
          description: Current authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /books:
    get:
      operationId: listBooks
      summary: List the authenticated author's books
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /books/{id}:
    get:
      operationId: getBook
      summary: Get one of the authenticated author's books
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /tickets:
    get:
      operationId: listAuthorTickets
      summary: List the authenticated author's tickets
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTicket
      summary: Submit a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                bookId:
                  type: string
                  nullable: true
                subject:
                  type: string
                  minLength: 3
                  maxLength: 150
                description:
                  type: string
                  minLength: 10
                  maxLength: 5000
                attachments:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [name, size, type]
                    properties:
                      name:
                        type: string
                        maxLength: 255
                      size:
                        type: integer
                        minimum: 0
                      type:
                        type: string
                        maxLength: 200
      responses:
        "201":
          $ref: "#/components/responses/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /tickets/{id}:
    get:
      operationId: getAuthorTicket
      summary: Get one of the authenticated author's tickets
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /tickets/{id}/replies:
    post:
      operationId: replyToTicket
      summary: Add an author reply to a ticket
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageBody"
      responses:
        "201":
          $ref: "#/components/responses/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/tickets:
    get:
      operationId: listAdminTickets
      summary: List and filter tickets in the admin queue
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Open, In Progress, Resolved, Closed]
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [Critical, High, Medium, Low]
        - name: assignedTo
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [default, createdAt]
      responses:
        "200":
          description: Paginated admin ticket queue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /admin/tickets/{id}:
    get:
      operationId: getAdminTicket
      summary: Get a ticket with admin-only details
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchAdminTicket
      summary: Update ticket status, category, priority, or assignee
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status:
                  type: string
                  enum: [Open, In Progress, Resolved, Closed]
                category:
                  type: string
                priority:
                  type: string
                  enum: [Critical, High, Medium, Low]
                assignedTo:
                  type: string
                  nullable: true
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/tickets/{id}/assign-me:
    post:
      operationId: assignTicketToMe
      summary: Assign a ticket to the current admin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/tickets/{id}/notes:
    post:
      operationId: addInternalNote
      summary: Add an internal note to a ticket
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageBody"
      responses:
        "201":
          $ref: "#/components/responses/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/tickets/{id}/draft:
    post:
      operationId: generateReplyDraft
      summary: Generate an AI reply draft for a ticket
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: AI reply drafting is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/tickets/{id}/reply:
    post:
      operationId: sendAdminReply
      summary: Send an admin reply to the author
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MessageBody"
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [In Progress, Resolved]
      responses:
        "201":
          $ref: "#/components/responses/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/tickets/{id}/reclassify:
    post:
      operationId: reclassifyTicket
      summary: Re-run AI ticket classification
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/stats:
    get:
      operationId: getAdminStats
      summary: Get admin dashboard statistics
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /health:
    get:
      operationId: getHealth
      summary: Check API, database, and AI configuration status
      security: []
      responses:
        "200":
          description: API health status.
          content:
            application/json:
              schema:
                type: object
                required: [status, db, ai]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  db:
                    type: string
                    enum: [connected, disconnected]
                  ai:
                    type: object
                    required: [configured, classifyModel, draftModel]
                    properties:
                      configured:
                        type: boolean
                      classifyModel:
                        type: string
                      draftModel:
                        type: string
        "503":
          description: API is degraded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    User:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [author, admin]
        authorId:
          type: string
          nullable: true
        authorRef:
          type: string
          nullable: true
    MessageBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              oneOf:
                - type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                      message:
                        type: string
                - type: object
                  additionalProperties: true
  responses:
    DataResponse:
      description: Successful response containing data.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {}
    BadRequest:
      description: Invalid request or validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required or the token is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user does not have permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error:
      description: Unexpected API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
security:
  - bearerAuth: []
